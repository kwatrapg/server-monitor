# Sentruo — Apache vhost (TLS). Adjust ServerName / cert paths.
<VirtualHost *:80>
    ServerName monitor.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName monitor.example.com
    DocumentRoot /var/www/sentruo

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/sentruo.crt
    SSLCertificateKeyFile   /etc/ssl/private/sentruo.key
    SSLProtocol            -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/sentruo>
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews
    </Directory>

    # Belt-and-braces (also enforced by the app's .htaccess and PHP).
    <FilesMatch "\.(env|sql|sh|md|po|mo|lock|ini|ya?ml)$|^\.|config\.php|composer\.(json|lock)">
        Require all denied
    </FilesMatch>
    RedirectMatch 404 (?i)/(\.git|database|includes|docs|vendor|bin|_backups)(/|$)
    RedirectMatch 404 (?i)/crons/(?!cron\.php$).*
    <Location /uploads>
        php_admin_flag engine off
    </Location>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    ErrorLog  ${APACHE_LOG_DIR}/sentruo-error.log
    CustomLog ${APACHE_LOG_DIR}/sentruo-access.log combined
</VirtualHost>
