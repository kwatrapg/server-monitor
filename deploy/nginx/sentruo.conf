# Sentruo — nginx + php-fpm vhost (TLS).
server {
    listen 80;
    server_name monitor.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name monitor.example.com;
    root /var/www/sentruo;
    index index.php;

    ssl_certificate     /etc/ssl/certs/sentruo.crt;
    ssl_certificate_key /etc/ssl/private/sentruo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    # Only these PHP entrypoints are reachable.
    location = /index.php    { include fastcgi_params; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
    location = /agent.php    { include fastcgi_params; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
    location = /callback.php { include fastcgi_params; fastcgi_pass unix:/run/php/php8.3-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }

    location / { try_files $uri /index.php$is_args$args; }

    location ^~ /assets/          { try_files $uri =404; }
    location ^~ /template/assets/ { try_files $uri =404; }

    # Everything else is denied.
    location ~ \.php$        { return 404; }
    location ~ /\.           { return 404; }
    location ~* \.(env|sql|sh|md|po|mo|lock|ya?ml)$ { return 404; }
    location ^~ /includes/   { return 404; }
    location ^~ /database/   { return 404; }
    location ^~ /crons/      { return 404; }
    location ^~ /vendor/     { return 404; }
    location ^~ /bin/        { return 404; }
    location ^~ /docs/       { return 404; }
    location ^~ /uploads/    { return 404; }
}
