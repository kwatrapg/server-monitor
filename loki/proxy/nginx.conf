worker_processes 1;
pid /tmp/loki-proxy-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;

    # Docker's embedded DNS - lets "loki" and "app_backend" resolve to whatever
    # the compose network currently assigns them, instead of baking in an IP.
    resolver 127.0.0.11 valid=30s;

    upstream loki_backend {
        server loki:3100;
    }

    upstream app_backend {
        # host-gateway requires Docker Engine 20.10+ / compose extra_hosts entry
        # "host.docker.internal:host-gateway" in the loki-proxy service (see
        # docker-compose.yml). The app runs on the host, not in this compose file.
        server host.docker.internal:80;
    }

    server {
        listen 3100;

        client_max_body_size 10m;

        # ---- internal auth_request targets - never reachable directly ----

        location = /_logspushauth {
            internal;
            proxy_pass http://app_backend/logspushauth.php;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Logs-Token $http_x_logs_token;
        }

        location = /_logsreadauth {
            internal;
            proxy_pass http://app_backend/logsreadauth.php;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # ---- push path: per-server token (Alloy -> here) ----

        location = /loki/api/v1/push {
            auth_request /_logspushauth;
            proxy_pass http://loki_backend;
            proxy_set_header Host $host;
        }

        # ---- everything else (queries, /ready, /metrics): shared read token (app -> here) ----

        location / {
            auth_request /_logsreadauth;
            proxy_pass http://loki_backend;
            proxy_set_header Host $host;
        }
    }
}
